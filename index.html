<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PAC-MAN</title>
<link rel="stylesheet" href="pacman.css">
</head>
<body>
<div class="container">
  <h1>PAC-MAN</h1>
  <div class="hud">
    <span>Pontos: <b id="score">0</b></span>
    <span>Vidas: <b id="lives">3</b></span>
    <span>Recorde: <b id="highscore">0</b></span>
  </div>
  <div class="game-wrap">
    <canvas id="game" width="480" height="432"></canvas>
    <div class="joystick" id="joystick" aria-hidden="true">
      <div class="stick" id="stick"></div>
    </div>
  </div>
  <p id="msg">Use setas ou WASD (desktop) / joystick (celular)</p>
  <button id="restart" style="display:none;">Jogar Novamente</button>
</div>
<script src="pacman.js"></script>
</body>
</html>
